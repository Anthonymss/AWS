services:
    mysqlspring:
        image: mysql:8
        ports:
            - 3307:3306
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: 123
            MYSQL_DATABASE: test
        networks:
            - red_spring
    spring_back:
        build: ./spring_aws
        env_file:
            - ./spring_aws/.env
        ports:
            - 8080:8080
        networks:
            - red_spring
networks:
    red_spring: {}

volumes:
    db_data: {}